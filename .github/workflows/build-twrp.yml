name: Build TWRP - k39tv1_bsp_1g

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Gereksiz programları sil, yer aç
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          sudo rm -rf /usr/local/julia* /opt/hostedtoolcache /opt/az /usr/share/miniconda
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Bağımlılıkları kur
        run: |
          sudo apt-get update
          sudo apt-get install -y git gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 bc rsync

      - name: repo aracını kur
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: git kullanıcı bilgisi
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: TWRP minimal manifest çek
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0
          repo sync -c --no-tags --no-clone-bundle -j4 --force-sync
          df -h /

      - name: Device tree'yi ekle
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          git clone https://github.com/ZH-XiJun/twrp_device_alps_k39tv1_bsp_1g.git -b twrp-9.0 device/alps/k39tv1_bsp_1g

      - name: Prebuilt kernel/dtb kontrolü
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          ls -la device/alps/k39tv1_bsp_1g/prebuilt/ || echo "UYARI: prebuilt dizini eksik olabilir"

      - name: Derle
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          source build/envsetup.sh
          lunch omni_k39tv1_bsp_1g-eng
          mka recoveryimage -j$(nproc)

      - name: recovery.img'i artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: recovery-k39tv1_bsp_1g
          path: ${{ github.workspace }}/twrp/out/target/product/k39tv1_bsp_1g/recovery.img
          retention-days: 14
